<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#33D69F"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="#0B1020"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#g1)" stroke-opacity="0.35" stroke-width="4"/>

  <!-- Coin -->
  <circle cx="352" cy="168" r="64" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="352" cy="168" r="48" fill="rgba(255,255,255,0.15)"/>

  <!-- Chart bars -->
  <g transform="translate(96,160)">
    <rect x="0" y="120" width="48" height="120" rx="8" fill="rgba(255,255,255,0.12)"/>
    <rect x="72" y="72" width="48" height="168" rx="8" fill="rgba(255,255,255,0.18)"/>
    <rect x="144" y="24" width="48" height="216" rx="8" fill="url(#g1)"/>
  </g>

  <!-- Rupee symbol (generic stylized) -->
  <g transform="translate(240,280)">
    <path d="M0 0 H120" stroke="#E7E9EE" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 36 H120" stroke="#E7E9EE" stroke-width="14" stroke-linecap="round"/>
    <path d="M0 0 Q84 0 84 60 Q84 120 0 120" stroke="#E7E9EE" stroke-width="14" fill="none"/>
    <path d="M0 120 L64 176" stroke="#33D69F" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
