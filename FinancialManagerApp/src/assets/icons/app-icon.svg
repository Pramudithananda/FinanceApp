<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient Definitions -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#grad1)" filter="url(#shadow)"/>
  
  <!-- Wallet Shape -->
  <g transform="translate(256, 256)">
    <!-- Wallet Body -->
    <rect x="-140" y="-80" width="280" height="160" rx="20" fill="#ffffff" opacity="0.95"/>
    
    <!-- Wallet Flap -->
    <path d="M -140 -80 Q -100 -120, 0 -120 Q 100 -120, 140 -80 L 140 -60 L -140 -60 Z" 
          fill="url(#grad2)" opacity="0.9"/>
    
    <!-- Money Symbol (රු - Rupee) -->
    <text x="0" y="20" font-size="120" font-weight="bold" text-anchor="middle" 
          fill="url(#grad1)" font-family="Arial, sans-serif">රු</text>
    
    <!-- Card Slot Lines -->
    <line x1="-100" y1="50" x2="-20" y2="50" stroke="url(#grad1)" stroke-width="4" opacity="0.6"/>
    <line x1="20" y1="50" x2="100" y2="50" stroke="url(#grad2)" stroke-width="4" opacity="0.6"/>
    
    <!-- Decorative Coins -->
    <circle cx="-100" cy="-40" r="15" fill="#FFD700" opacity="0.8"/>
    <circle cx="-70" cy="-50" r="12" fill="#FFA500" opacity="0.8"/>
    <circle cx="100" cy="-40" r="15" fill="#FFD700" opacity="0.8"/>
    <circle cx="70" cy="-50" r="12" fill="#FFA500" opacity="0.8"/>
  </g>
  
  <!-- Bottom Accent -->
  <path d="M 50 480 Q 256 450, 462 480 L 462 512 L 50 512 Z" fill="url(#grad2)" opacity="0.3"/>
</svg>
