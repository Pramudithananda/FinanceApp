name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Setup Java
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v2
      
    - name: Install dependencies
      run: npm install
      
    - name: Make gradlew executable
      run: chmod +x android/gradlew
      
    - name: Build APK
      run: |
        cd android
        ./gradlew assembleRelease
      env:
        ANDROID_HOME: ${{ env.ANDROID_HOME }}
        
    - name: Upload APK
      uses: actions/upload-artifact@v3
      with:
        name: FinanceApp-release.apk
        path: android/app/build/outputs/apk/release/app-release.apk
        
    - name: Upload to Catbox
      run: |
        curl -F "reqtype=fileupload" \
             -F "fileToUpload=@android/app/build/outputs/apk/release/app-release.apk" \
             https://catbox.moe/user/api.php > catbox_url.txt
        echo "APK uploaded to: $(cat catbox_url.txt)"
